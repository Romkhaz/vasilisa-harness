# This workflow builds release artifacts for release branches and publishes tagged releases.
on:
  push:
    paths-ignore:
      - "docs/**"
    branches:
      - "release/*"
    tags:
      - "v1.*"

name: Release

permissions:
  contents: read

env:
  # Set this repository Actions variable to "true" in GitHub Settings > Secrets and variables
  # > Actions > Variables after a release containing desktop app-update.yml has shipped.
  ENABLE_MAC_NATIVE_AUTO_UPDATE: ${{ vars.ENABLE_MAC_NATIVE_AUTO_UPDATE || 'false' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 1) Bundle Desktop (macOS ARM64)
  # ------------------------------------------------------------
  bundle-macos-arm64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: aarch64-apple-darwin
      # CLI пока не выпускаем — в релиз идут только три приложения.
      package_cli: false
      package_desktop: true
      # Подпись Developer ID и нотаризация. Сертификат и ключ notarytool лежат
      # в окружении release: доступ к ним получает только эта джоба и только
      # после правил защиты окружения.
      signing: true
      environment: release
    secrets: inherit

  # ------------------------------------------------------------
  # 2) Bundle Desktop App (Linux)
  # ------------------------------------------------------------
  bundle-desktop-linux:
    uses: ./.github/workflows/bundle-desktop-linux.yml

  # ------------------------------------------------------------
  # 3) Bundle Desktop (Windows)
  # ------------------------------------------------------------
  bundle-windows:
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      id-token: write
      contents: read
    with:
      # CLI пока не выпускаем — в релиз идут только три приложения.
      package_cli: false
      package_desktop: true
      # Сертификатов Apple и Windows у проекта нет — сборки выпускаются неподписанными.
      signing: false
    secrets: inherit

  # ------------------------------------
  # 4) Create/Update GitHub Release
  # ------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [bundle-macos-arm64, bundle-desktop-linux, bundle-windows]
    permissions:
      contents: write
      id-token: write      # Required for Sigstore OIDC signing
      attestations: write  # Required for SLSA build provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create source code bundles
        run: |
          git archive --format=tar.gz --prefix="vasilisa-${GITHUB_REF_NAME}/" --output="vasilisa-source-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="vasilisa-${GITHUB_REF_NAME}/" --output="vasilisa-source-${GITHUB_REF_NAME}.zip" HEAD

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '!internal-*'
          merge-multiple: true

      - name: Generate macOS update manifest
        if: ${{ env.ENABLE_MAC_NATIVE_AUTO_UPDATE == 'true' }}
        run: node ui/desktop/scripts/generate-mac-update-manifest.js --version "${GITHUB_REF_NAME}" --directory .

      - name: Attest macOS update manifest
        if: ${{ env.ENABLE_MAC_NATIVE_AUTO_UPDATE == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: latest-mac.yml

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            Vasilisa*.zip
            Vasilisa*.dmg
            Vasilisa-setup*.exe
            *.deb
            *.rpm
            *.flatpak

      # Create/update the versioned release
      - name: Release versioned
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            Vasilisa*.zip
            Vasilisa*.dmg
            Vasilisa-setup*.exe
            *.deb
            *.rpm
            *.flatpak
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true

      # Create/update the stable release
      - name: Release stable
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: stable
          name: Stable
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            Vasilisa*.zip
            Vasilisa*.dmg
            Vasilisa-setup*.exe
            *.deb
            *.rpm
            *.flatpak
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true

      - name: Upload macOS update manifest
        if: ${{ env.ENABLE_MAC_NATIVE_AUTO_UPDATE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" latest-mac.yml --clobber
          gh release upload stable latest-mac.yml --clobber
