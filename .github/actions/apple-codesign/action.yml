name: 'Apple Certificate Keychain Setup'
description: 'Import a Developer ID certificate into a temporary keychain for Electron Forge signing'

inputs:
  certificate-base64:
    description: 'Base64-encoded Developer ID Application .p12 certificate'
    required: true
  certificate-password:
    description: 'Password for the .p12 certificate'
    required: true

outputs:
  keychain-path:
    description: 'Path to the temporary keychain'
    value: ${{ steps.import-cert.outputs.keychain-path }}

runs:
  using: 'composite'
  steps:
    - name: Import Apple certificate
      id: import-cert
      shell: bash
      env:
        APPLE_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -e

        CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

        echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

        # security на любую беду отвечает «Unknown format in import», по которой
        # не понять, что именно не так с секретом. Заглядываем в контейнер сами,
        # но решение оставляем за security: openssl 3 без -legacy не берёт
        # RC2-40-CBC, которым Keychain Access шифрует экспорт, поэтому его отказ
        # ещё не означает, что файл плохой.
        if ! openssl pkcs12 -in "$CERTIFICATE_PATH" -noout -passin env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null \
          && ! openssl pkcs12 -in "$CERTIFICATE_PATH" -noout -legacy -passin env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null; then
          echo "::warning::openssl не разобрал APPLE_CERTIFICATE_BASE64 как .p12 ($(wc -c < "$CERTIFICATE_PATH") байт после base64). Если импорт ниже упадёт — в секрете лежит не тот файл либо не тот пароль."
        fi

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" \
          -f pkcs12 \
          -k "$KEYCHAIN_PATH" \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign

        security set-key-partition-list \
          -S apple-tool:,apple: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

        # Без Developer ID подпись всё равно не выйдет — лучше упасть здесь,
        # чем через полчаса на codesign.
        if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
          echo "::error::В связке нет сертификата Developer ID Application. Экспортируйте его из «Мои сертификаты» вместе с приватным ключом."
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          exit 1
        fi

        echo "keychain-path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

        rm -f "$CERTIFICATE_PATH"
